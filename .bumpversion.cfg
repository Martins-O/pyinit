[bumpversion]
current_version = 0.1.10
commit = True
tag = True
message = "🔖 Release {new_version}"

[bumpversion:file:pyinit/__main__.py]
search = VERSION = "{current_version}"
replace = VERSION = "{new_version}"

def auto_bump_patch(project_path: Path):
    import subprocess
    cfg_path = project_path / ".bumpversion.cfg"
    if cfg_path.exists():
        subprocess.run(["bump2version", "--allow-dirty", "patch"], cwd=project_path)
    else:
        print(Fore.YELLOW + "⚠️ No .bumpversion.cfg found. Skipping version bump." + Style.RESET_ALL)