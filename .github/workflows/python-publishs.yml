name: Python Package Publish

on:
  push:
    branches:
      - indev
  pull_request:
    branches:
      - indev

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

      - name: Configure Git (for bumpversion commit and tag)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install tools
        run: |
          pip install --upgrade pip
          pip install setuptools wheel twine bump2version

      - name: Bump patch version automatically
        run: |
          VERSION=$(grep 'VERSION =' pyinit/__main__.py | cut -d '"' -f2)
          echo "Current version: $VERSION"

          MAJOR=$(echo $VERSION | cut -d '.' -f1)
          MINOR=$(echo $VERSION | cut -d '.' -f2)
          PATCH=$(echo $VERSION | cut -d '.' -f3 | cut -d '-' -f1)
          PATCH=${PATCH:-0}

          NEXT_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEXT_PATCH"
          echo "Next version: $NEW_VERSION"
          
          bump2version --new-version "$NEW_VERSION" --allow-dirty patch
          echo "Next version: $NEW_VERSION"


      - name: Build package
        run: python setup.py sdist bdist_wheel

      - name: Publish to PyPI
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

      - name: Push version bump commit and tag
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.email "jojololamartins686@gmail.com"
          git config --global user.name "martins-o"
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}
          git push origin HEAD
          git push origin --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: Auto-generated release from CI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
